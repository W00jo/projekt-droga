name: Headless Sanity Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  # Base version extracted from project.godot features.
  # Modify this if Godot begins requiring specific patches (e.g., 4.6.1-stable)
  GODOT_VERSION: "4.6-stable"

jobs:
  headless-sanity-check:
    name: Headless Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Install Godot Engine
        run: |
          echo "[INFO] Fetching Godot Engine v${GODOT_VERSION}..."
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip

          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          rm godot.zip

      - name: Headless Asset Parse & Sanity Check
        run: |
          set -eo pipefail
          echo "[INFO] Commencing Godot Engine editor simulation..."
          # Pipe stdout and stderr into a single log file
          godot --headless --editor --quit 2>&1 | tee engine_import.log
          
          # Hunt for explicit Godot Error markers in the output
          if grep -q "ERROR:" engine_import.log; then
            echo "::error::[ERROR] Engine structural or script defects detected during Headless cache generation."
            exit 1
          else
            echo "[INFO] Engine simulation completed with exit code 0."
            exit 0
          fi
